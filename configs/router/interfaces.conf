auto lo
iface lo inet loopback

auto eth0
iface eth0 inet manual
    up ip link set dev eth0 up
    post-up sysctl -w net.ipv4.ip_forward=1 || echo 1 > /proc/sys/net/ipv4/ip_forward

auto eth1
iface eth1 inet dhcp
    up /bin/sh /etc/network/nat.sh
    up /bin/sh /etc/network/filter.sh

# VLAN 10 - ADMIN
auto eth0.10
iface eth0.10 inet static
    pre-up ip link show eth0.10 >/dev/null 2>&1 || ip link add link eth0 name eth0.10 type vlan id 10
    address 10.10.10.1
    netmask 255.255.255.0

